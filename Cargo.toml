[package]
name = "cozy-landscape"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = {version = "0.20.1", features = ["dynamic_linking"]}
noise = "0.9"
avian3d = "0.8"


# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3

# Spezielles Profil nur für WASM (Größen-Optimierung)
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 4
strip = true
panic = "abort"